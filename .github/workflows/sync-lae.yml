name: Sincronizar con Loterías (LAE)

# Por qué esto vive en GitHub Actions y no en una Edge Function de Supabase:
# loteriasyapuestas.es está detrás de Akamai y devuelve 403 a cualquier cliente
# HTTP que no sea un navegador de verdad — comprobado con cabeceras completas de
# Chrome. Tampoco manda CORS, así que el navegador del admin tampoco puede
# llamarlo desde la app. La única vía fiable es un Chromium real, y aquí sale
# gratis. Ver docs/lae.md.

# El cron está DESACTIVADO a propósito, no olvidado.
#
# Akamai bloquea el rango de IP de los runners de GitHub: 13 de 13 ejecuciones
# seguidas terminaron en 403, con Chromium y con Chrome de verdad, mientras el
# mismo endpoint responde 200 desde una IP doméstica (medido en docs/lae.md).
# Programarlo solo servía para mandar tres correos de fallo por semana y para
# que el repo pareciera roto cuando lo que está roto es el acceso.
#
# Los horarios de cuando funcionaba se dejan escritos: eran domingo por la
# tarde/noche y lunes de madrugada —cuando LAE publica el escrutinio— más el
# miércoles para los plazos de la jornada nueva. Si algún día se resuelve el
# bloqueo (runner self-hosted o proxy), se descomenta y ya está.
#
#  schedule:
#    - cron: '0 20,21,22,23 * * 0'
#    - cron: '0 0,8 * * 1'
#    - cron: '0 9 * * 3'
#
# Mientras tanto se dispara a mano, que es lo que hace el botón "Sincronizar
# con LAE ahora" del panel — por si el bloqueo cede en algún momento.
on:
  workflow_dispatch:
    inputs:
      desde:
        description: 'Fecha inicio AAAAMMDD (para recargar histórico)'
        required: false
      hasta:
        description: 'Fecha fin AAAAMMDD'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chrome de verdad, no el Chromium empaquetado: es el primer escalón del
      # plan de docs/lae.md para cuando Akamai endurece la detección. El
      # Chromium de Playwright tiene un fingerprint de TLS y unos flags que se
      # distinguen del navegador real.
      - name: Instalar Chrome
        run: npx playwright install --with-deps chrome

      - name: Sincronizar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LAE_DESDE: ${{ inputs.desde }}
          LAE_HASTA: ${{ inputs.hasta }}
        run: npm run sync:lae

      - name: Guardar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lae-debug
          path: |
            lae-debug/
          if-no-files-found: ignore
          retention-days: 7
